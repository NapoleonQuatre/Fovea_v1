<!-- Ajout de la section voix -->
<div class="voice-control">
  <div class="voice-readout">
    <label class="field-label" for="opt-voice">Lecture vocale</label>
    <div class="voice-toggle">
      <button type="button" id="btn-voice" class="btn ghost" aria-pressed="false">
        <svg id="icon-voice-on" viewBox="0 0 24 24" hidden>...</svg>
        <svg id="icon-voice-off" viewBox="0 0 24 24">...</svg>
        <span>Voix</span>
      </button>
    </div>
  </div>
  <div class="voice-settings">
    <select id="voice-model" class="select-model" disabled>
      <option value="">Aucune</option>
      <option value="fr_FR-upmc-medium">Français (UPMC Medium)</option>
      <option value="fr_FR-siwis-low">Français (Siwis Low)</option>
      <option value="fr_FR-siwis-medium">Français (Siwis Medium)</option>
    </select>
    <span id="voice-status" class="voice-status" aria-live="polite"></span>
  </div>
</div>
